name = "just-be-dev"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "disable_nodejs_process_v2"]

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"

# Desk (desk.just-be.dev) is the system of record for projects. The site calls
# `listPublicProjects()` on the default entrypoint of Desk's private API Worker
# (an Alchemy Effect-native Worker, so there is no named entrypoint) at request
# time; see src/utils/site-projects.ts. Update `service` in both blocks if
# Desk's stack replaces the Worker.
[[services]]
binding = "DESK"
service = "desk-api-prod-52zp2vud3ktnsddd"

# `mise run dev:desk` (CLOUDFLARE_ENV=desk-remote) talks to prod Desk through a
# remote binding instead of the dev fixture. Local dev only; never deployed.
[env.desk-remote]
vars = { DESK_DEV = "remote" }

[[env.desk-remote.services]]
binding = "DESK"
service = "desk-api-prod-52zp2vud3ktnsddd"
remote = true
