name = "just-be-dev"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "disable_nodejs_process_v2"]

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "MICRO_BUCKET"
bucket_name = "micro"
