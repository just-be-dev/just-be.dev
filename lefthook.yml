pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{js,ts,jsx,tsx,json,md,mdx,css,html,yml,yaml}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    prettier-astro:
      glob: "*.astro"
      run: bunx --bun prettier --write --list-different {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{js,ts,jsx,tsx,astro}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
