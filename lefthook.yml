pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{js,ts,jsx,tsx,astro,json,md,mdx,css,html}"
      run: bunx --bun prettier --write --list-different {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{js,ts,jsx,tsx,astro}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
