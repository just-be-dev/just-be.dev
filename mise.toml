[tools]
bun = "1.3.5"
lefthook = "2.0.13"
python = "3.11"
ffmpeg = "latest"
uv = "latest"

[settings]
experimental = true
pin = true

[hooks]
postinstall = ["bun install", "lefthook install"]

[env]
_.path = "node_modules/.bin"

[tasks.dev]
run = "astro dev"

[tasks.build]
run = "astro build"

[tasks.preview]
run = "astro preview"

[tasks.astro]
run = "astro"

[tasks.fmt]
run = "prettier -wl ."

[tasks.test]
run = "vitest"

[tasks."test:ui"]
run = "vitest --ui"

[tasks.prefix-codes]
run = "bun scripts/prefix-codes.ts"

[tasks.upload-assets]
run = "bun scripts/upload-assets.ts"
description = "Upload assets (images, audio) to R2 and update manifest"

[tasks.deploy]
run = "wrangler deploy"
depends = ["build"]

[tasks.transcribe]
run = "uv run --with openai-whisper python scripts/transcribe.py"
description = "Generate word-level transcript from audio/video"
