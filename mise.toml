[tools]
bun = "1.3.6"
lefthook = "2.0.15"
python = "3.14.2"
ffmpeg = "latest"
uv = "latest"

[settings]
experimental = true
pin = true

[hooks]
postinstall = ["bun install", "lefthook install"]

[env]
_.path = "node_modules/.bin"

[tasks.dev]
run = "astro dev --host"

[tasks.gen-url-manifest]
run = "bun scripts/gen-url-manifest.ts"
description = "Generate URL manifest mapping slugs to codes"

[tasks.build]
run = "astro build"
depends = ["gen-url-manifest"]

[tasks.preview]
run = "astro preview"

[tasks.astro]
run = "astro"

[tasks.fmt]
run = "prettier -wl ."

[tasks.lint]
run = "oxlint"

[tasks."lint:fix"]
run = "oxlint --fix"

[tasks.test]
run = "bun test"

[tasks.gen-codes]
run = "bun scripts/gen-codes.ts"

[tasks.upload-assets]
run = "bun scripts/upload-assets.ts"
description = "Upload assets (images, audio) to R2 and update manifest"

[tasks.deploy]
run = "wrangler deploy"
depends = ["build"]

[tasks."deploy:wildcard"]
run = "cd services/wildcard && bun run deploy"
description = "Deploy wildcard subdomain service"

[tasks.transcribe]
run = "uv run --with openai-whisper python scripts/transcribe.py"
description = "Generate word-level transcript from audio/video"
