name: Update Changelog

on:
  push:
    branches: [main]

env:
  MISE_DISABLE_TOOLS: ffmpeg

# Prevent concurrent runs to avoid race conditions
concurrency:
  group: changelog-update
  cancel-in-progress: false

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3
        with:
          experimental: true

      - name: Install dependencies
        run: mise install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate changelog
        run: mise run changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changes to changelog"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changelog has changes"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Get changelog diff
        if: steps.check_changes.outputs.has_changes == 'true'
        id: get_diff
        run: |
          # Extract new content added to the changelog
          # This will show all the new entries that were added
          echo "## Changelog Updates" > /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo "The following entries will be added to the changelog:" >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo '```markdown' >> /tmp/pr_body.md
          # Use unified diff format and skip the first 4 lines (diff header)
          git diff --unified=0 CHANGELOG.md | tail -n +5 | grep '^+' | sed 's/^+//' >> /tmp/pr_body.md
          echo '```' >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo "---" >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          echo "🤖 Auto-generated by the [changelog workflow](.github/workflows/changelog.yml)" >> /tmp/pr_body.md

      - name: Create or update branch
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Fetch all branches
          git fetch origin

          # Check if changelog branch exists
          if git rev-parse --verify origin/changelog >/dev/null 2>&1; then
            echo "Branch exists, checking out"
            git checkout -B changelog origin/main
          else
            echo "Creating new branch"
            git checkout -b changelog
          fi

          # Add the changes
          git add CHANGELOG.md
          git commit -m "Update changelog from recent PRs"

          # Force push to changelog branch
          git push --force origin changelog

      - name: Check for existing PR
        if: steps.check_changes.outputs.has_changes == 'true'
        id: check_pr
        run: |
          PR_NUMBER=$(gh pr list --head changelog --base main --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "pr_number=" >> $GITHUB_OUTPUT
          else
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        if: steps.check_changes.outputs.has_changes == 'true' && steps.check_pr.outputs.pr_exists == 'false'
        run: |
          gh pr create \
            --title "Update changelog" \
            --body-file /tmp/pr_body.md \
            --head changelog \
            --base main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PR
        if: steps.check_changes.outputs.has_changes == 'true' && steps.check_pr.outputs.pr_exists == 'true'
        run: |
          gh pr edit ${{ steps.check_pr.outputs.pr_number }} \
            --body-file /tmp/pr_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
