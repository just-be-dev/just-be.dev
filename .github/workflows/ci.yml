name: CI

on:
  push:

env:
  MISE_DISABLE_TOOLS: ffmpeg

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup mise
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4
        with:
          experimental: true

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test
