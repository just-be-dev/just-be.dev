name = "just-be-dev-wildcard"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# Wildcard subdomain routes
[[routes]]
pattern = "*.just-be.dev/*"

[observability]
enabled = true

# KV namespace for routing rules
[[kv_namespaces]]
binding = "ROUTING_RULES"
id = "6118ae3b937c4883b3c582dfef8a0c05"

# R2 bucket for static content
# Run: wrangler r2 bucket create content-bucket
# Then update the bucket_name below if needed
[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "content-bucket"

# Environment variables
[vars]
ORIGIN_URL = "https://just-be.dev"
